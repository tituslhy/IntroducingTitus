<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credits roll</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tiles.css">
<style>
  :root { --film: oklch(0.17 0.008 60); }
  .before { height: 60vh; display: grid; place-items: center; font: 12px var(--mono); color: var(--ink-faint); }
  /* the section is taller than the window; the tile sticks while the credits rise through it */
  .roll { height: 190vh; position: relative; }
  .stage { position: sticky; top: 70px; height: min(600px, calc(100vh - 100px)); background: var(--film); border-radius: 20px; overflow: hidden; color: var(--paper); text-align: center; }
  .window { position: absolute; inset: 0; -webkit-mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent); }
  .list { position: absolute; left: 0; right: 0; top: 0; padding: 0 24px; will-change: transform; }
  .t { font: 500 11px var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--amber-hi); }
  .s { margin: 12px 0 0; font: italic 17px var(--serif); color: oklch(0.78 0.02 70); }
  dl { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; row-gap: 26px; max-width: 780px; margin: 40px auto 0; }
  dt { text-align: right; font: 500 11.5px/1.9 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: oklch(0.7 0.02 70); }
  dd { margin: 0; text-align: left; }
  dd a { color: var(--paper); text-decoration: none; font: 19px/1.3 var(--serif); }
  dd .ref { display: block; margin-top: 5px; font: 11.5px var(--mono); color: var(--amber-hi); letter-spacing: .04em; }
  .end { margin: 56px 0 0; font: 12px var(--mono); color: oklch(0.6 0.02 70); }
  .ask { margin-top: 16px; display: inline-block; border: 1px solid var(--ink); border-radius: 999px; padding: 9px 16px; font: 13px var(--mono); }
  @media (max-width: 720px) {
    dl { grid-template-columns: 1fr; row-gap: 4px; }
    dt { text-align: center; margin-top: 22px; } dd { text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) { .roll { height: auto; } .stage { position: static; height: auto; padding: 48px 0; } .window { position: static; -webkit-mask-image: none; mask-image: none; } .list { position: static; transform: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="before">… earlier work above …</div>
  <section class="roll" id="open-source">
    <div class="stage"><div class="window">
      <div class="list">
        <div class="t">Open source</div>
        <p class="s">Merged into the frameworks I use.</p>
        <dl id="credits"></dl>
        <p class="end">6 contributions · each links to its pull request or commit</p>
      </div>
    </div></div>
  </section>
  <a class="ask">Ask about my open source work →</a>
  <div style="height:40vh"></div>
</div>
<script>
const C = [
  ['LlamaIndex', 'Integration with Microsoft LLMLingua2 prompt compression', 'run-llama/llama_index · PR #17531'],
  ['LlamaIndex', 'Gmail Tool bug fix', 'run-llama/llama_index · commit d5c0fe1'],
  ['Unsloth', 'Retrieval Augmented Finetuning cookbook', 'unslothai/notebooks · PR #51'],
  ['IBM ACP', 'Agent Communication Protocol LlamaIndex example', 'i-am-bee/acp · PR #176'],
  ['Giskard', 'RAGET bug fix', 'Giskard-AI/giskard-oss · PR #2178'],
  ['Chainlit', 'Chainlit-LlamaIndex cookbook', 'Chainlit/cookbook · PR #138'],
]
document.getElementById('credits').innerHTML = C.map(([p, t, r]) => `<dt>${p}</dt><dd><a href="#">${t} ↗</a><span class="ref">${r}</span></dd>`).join('')
// scroll-linked: the list starts below the tile and rises past it as you scroll through the section
const roll = document.querySelector('.roll'), stage = document.querySelector('.stage'), list = document.querySelector('.list')
const update = () => {
  const r = roll.getBoundingClientRect(), span = roll.offsetHeight - stage.offsetHeight
  const p = Math.min(1, Math.max(0, (70 - r.top) / span))
  const from = stage.offsetHeight * 0.75, to = -(list.offsetHeight - stage.offsetHeight * 0.55)
  list.style.transform = `translateY(${from + (to - from) * p}px)`
}
if (!matchMedia('(prefers-reduced-motion: reduce)').matches) { addEventListener('scroll', update, { passive: true }); addEventListener('resize', update); update() }
</script>
</body>
</html>
