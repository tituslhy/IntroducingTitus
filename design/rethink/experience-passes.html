<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experience staff passes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tiles.css">
<style>
  .page { display: block; padding-top: 40px; }

  /* ---------- the desk ---------- */
  .desk { position: relative; background: var(--paper-deep); border-radius: 28px; padding: 26px 26px 30px; margin-top: 8px; overflow: hidden; }
  .desk .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
  .desk .hd b { color: var(--ink); font-weight: 600; }
  .all { font: 12.5px var(--mono); letter-spacing: .02em; text-transform: none; color: var(--paper); background: var(--ink); border: 0; border-radius: 999px; padding: 8px 15px; cursor: pointer; }
  .all[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .allsign { display: flex; gap: 12px; align-items: center; padding: 12px 0; margin-top: 36px; border-top: 3px solid var(--ink); border-bottom: 1px solid var(--rule); font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); scroll-margin-top: 20px; }
  .allsign i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .allsign:first-child { margin-top: 0; border-top: 0; }
  .showall .sign { display: none; } .showall .details { border-top: 0; }
  .fan { position: relative; height: 410px; margin: 10px 46px 0; perspective: 1400px; }

  .pass { --rot: 0deg; --lift: 0px; position: absolute; top: 40px; width: 220px; height: 320px; padding: 0; border: 0; background: none; cursor: pointer; transform-origin: 50% 120%; transform: translateY(var(--lift)) rotate(var(--rot)); transition: transform .45s cubic-bezier(.3,.7,.2,1); font-family: var(--serif); }
  .pass:hover { --lift: -18px; }
  .pass[aria-selected="true"] { --lift: -34px; --rot: 0deg !important; z-index: 20 !important; }
  .pass:focus { outline: none; }
  .pass:focus-visible .face { box-shadow: 0 0 0 3px var(--amber); }
  .pass[aria-selected="true"] .face { border-width: 4px; box-shadow: 0 0 0 4px color-mix(in oklch, var(--brand) 30%, transparent), 0 18px 40px oklch(0.3 0.03 60 / .25); }
  .brandrow { display: flex; align-items: center; gap: 9px; }
  .logo { flex: none; width: 30px; height: 30px; border-radius: 8px; background-color: #fff; background-repeat: no-repeat; display: grid; place-items: center; overflow: hidden; box-shadow: 0 0 0 1.5px oklch(1 0 0 / .6); }
  .logo img { max-width: 26px; max-height: 22px; display: block; }
  .hl { display: none; margin: auto 10px 10px; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 12px; }
  .hl .f { font: 500 30px/1 var(--serif); letter-spacing: -.03em; color: var(--amber-hi); }
  .hl .f.words { font-size: 22px; }
  .hl .c { font: 10.5px/1.35 var(--mono); color: oklch(0.85 0.02 78); margin-top: 5px; }
  .pass[aria-selected="true"] .hl { display: block; animation: turn .35s ease; }
  .pass[aria-selected="true"] .code, .pass[aria-selected="true"] .valid { display: none; }
  .card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.2,1); }
  .pass.flipped .card { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px; background: var(--paper); border: 3px solid var(--brand); box-shadow: 0 1px 0 oklch(0 0 0 / .06), 0 10px 26px oklch(0.3 0.03 60 / .16); overflow: hidden; text-align: left; display: flex; flex-direction: column; }
  .back { transform: rotateY(180deg); background: var(--ink); color: var(--paper); }

  /* front */
  .slot { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 52px; height: 9px; border-radius: 5px; background: var(--paper-deep); box-shadow: inset 0 1px 2px oklch(0 0 0 / .18); z-index: 2; }
  .band { height: 100px; padding: 30px 16px 0; color: var(--paper); }
  .band .co { font: 600 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
  .band .kind { font: 10px var(--mono); letter-spacing: .12em; opacity: .75; margin-top: 4px; }
  .who { display: flex; gap: 12px; align-items: center; padding: 0 16px; margin-top: -22px; }
  .mono { flex: none; width: 58px; height: 70px; border-radius: 8px; background: var(--ink); border: 3px solid var(--paper); display: grid; place-items: center; font: italic 500 24px var(--serif); color: var(--amber-hi); }
  .who .nm { font: 500 16px var(--serif); line-height: 1.2; margin-top: 22px; color: var(--ink); }
  .who .nm small { display: block; font: 9.5px var(--mono); letter-spacing: .1em; color: var(--ink-soft); margin-top: 3px; }
  .role { padding: 0 16px; margin-top: 12px; font-size: 18px; font-weight: 500; line-height: 1.15; letter-spacing: -.01em; color: var(--ink); }
  .valid { padding: 0 16px; margin-top: auto; font: 10.5px/1.5 var(--mono); color: var(--ink-soft); letter-spacing: .04em; }
  .valid b { color: var(--ink); font-weight: 500; }
  .code { margin: 10px 16px 14px; height: 26px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px); opacity: .8; }
  .tag { position: absolute; top: 9px; right: 10px; z-index: 3; font: 600 9.5px var(--mono); letter-spacing: .16em; background: var(--paper); color: var(--amber); border-radius: 999px; padding: 4px 8px; }

  /* back */
  .back .inner { padding: 30px 18px 16px; display: flex; flex-direction: column; height: 100%; position: relative; }
  .back .inner::before { content: ''; position: absolute; inset: -40%; background: radial-gradient(closest-side, oklch(0.62 0.155 55 / .35), transparent 70%); }
  .back .inner > * { position: relative; }
  .back .lbl { font: 500 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: oklch(0.75 0.02 78); }
  .back .fig { font-size: 52px; font-weight: 500; letter-spacing: -.04em; line-height: .95; color: var(--amber-hi); margin-top: 18px; }
  .back .fig.words { font-size: 34px; }
  .back .cap { font-style: italic; font-size: 15px; line-height: 1.3; color: oklch(0.88 0.02 78); margin-top: 8px; }
  .back .deck { font-size: 15px; line-height: 1.4; color: oklch(0.9 0.02 78); margin-top: 16px; }
  .back .ten { margin-top: auto; font: 11px var(--mono); color: oklch(0.8 0.02 78); }
  .back .ten b { color: var(--amber-hi); font-weight: 500; }
  .back .down { font: 11px var(--mono); color: var(--amber-hi); margin-top: 6px; }

  .hint { font: 12px var(--mono); color: var(--ink-faint); margin: 6px 0 0; }

  /* ---------- details under the desk ---------- */
  .details { margin-top: 26px; border-top: 3px solid var(--ink); }
  .sign { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--rule); font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
  .sign .badge { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 6px 12px; letter-spacing: .12em; }
  .sign .badge b { color: var(--amber-hi); }
  .sign .sp { flex: 1; }
  .sign button { font: 12px var(--mono); text-transform: none; letter-spacing: .04em; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 7px 13px; cursor: pointer; }
  .sign button:hover:not(:disabled) { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .sign button:disabled { opacity: .35; cursor: default; }
  .item { border-top: 0; padding-top: 34px; }
  .item.turn { animation: turn .45s ease; }
  @keyframes turn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .side .co2 { font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 1.08; margin: 10px 0; }
  .side .ro2 { font-size: 19px; line-height: 1.3; }
  .story .lead a { color: inherit; text-decoration-color: var(--amber); text-underline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { .pass, .card { transition: none; } .item.turn { animation: none; } }

  /* phone: the passes sit in a row you swipe */
  @media (max-width: 820px) {
    .fan { height: auto; margin: 10px -26px 0; display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 40px 4px 10px; margin: 0 -26px; padding-left: 26px; padding-right: 26px; }
    .pass { position: relative; top: 0; left: auto !important; flex: none; scroll-snap-align: center; --rot: 0deg !important; transform-origin: center; }
  }
</style>
</head>
<body>
<div class="wrap">
<section class="page">
  <div class="kicker"><b>01</b>Experience</div>
  <h1>Every <em>pass</em> I have worn, 2015 to now.</h1>

  <div class="results">
    <button class="rt" data-go="mastercard"><span class="fig">8+</span><span class="lab">years building production AI <i>→</i></span></button>
    <button class="rt" data-go="uob"><span class="fig">80%</span><span class="lab">fewer false positives, UOB <i>→</i></span></button>
    <button class="rt" data-go="illumina"><span class="fig">$9M</span><span class="lab">anticipated savings, Illumina <i>→</i></span></button>
    <button class="rt" data-go="toyota-tsusho"><span class="fig">~25%</span><span class="lab">better forecast accuracy, Toyota Tsusho <i>→</i></span></button>
  </div>

  <div class="desk">
    <div class="hd"><span><b>7 staff passes</b> · oldest on the left</span><button class="all" id="all" aria-pressed="false">Show all seven ↓</button></div>
    <div class="fan" id="fan" role="tablist" aria-label="One staff pass per role"></div>
    <p class="hint">Click a pass to pick it up. <kbd style="font:11px var(--mono)">←</kbd> <kbd style="font:11px var(--mono)">→</kbd> move along.</p>
  </div>

  <div class="details">
    <div class="sign">
      <span class="badge" id="badge"></span>
      <span id="signdates"></span>
      <span class="sp"></span>
      <button id="prev">← Earlier pass</button>
      <button id="next">Later pass →</button>
    </div>
    <div id="panel" role="tabpanel"></div>
  </div>
</section>
</div>
<div class="toast" id="toast"></div>

<script>
  const ROLES = [
    { slug: 'toyota-tsusho', company: 'Toyota Tsusho Asia Pacific', short: 'Toyota Tsusho', role: 'Demand & Supply Analyst', start: [2015, 6], end: [2017, 4], dates: 'Jun 2015 — Apr 2017', loc: 'Singapore',
      deck: 'Overhauled sales planning into a centralised automated forecasting tool using VBA and operational research techniques.', body: 'Served Toyota automotive distributors across the Asia Pacific region.',
      tech: ['VBA', 'Excel', 'Exponential Smoothing', 'Holt-Winters'], hl: { figure: '~25%', caption: 'better long-term forecast accuracy' } },
    { slug: 'jobtech', company: 'JobTech Pte Ltd', short: 'JobTech', role: 'Data Scientist', start: [2017, 4], end: [2017, 8], dates: 'Apr 2017 — Aug 2017', loc: 'Singapore',
      deck: 'Built a national-scale skill extraction algorithm using NLP to construct skills graphs from online job portals.', body: "Findings published in a Business Insider report on Indonesia's labour market.",
      tech: ['Python', 'NLP', 'Regex Entity Extraction'] },
    { slug: 'ema', company: 'Energy Market Authority', short: 'EMA', role: 'Principal Engineer, Research & Statistics', start: [2018, 4], end: [2022, 8], dates: 'Apr 2018 — Aug 2022', loc: 'Singapore',
      deck: "Developed and presented national electricity and gas demand forecasts to Ministers and Permanent Secretaries; drove the Authority's AI and data strategy roadmap.", body: 'Built ML models for power-plant trip prediction and electricity spot-price forecasting with external partners.',
      tech: ['Python', 'XGBoost', 'Neural Networks', 'DataRobot', 'ARIMA'] },
    { slug: 'ck-delta', company: 'CK Delta', short: 'CK Delta', role: 'Data Scientist', start: [2022, 9], end: [2023, 1], dates: 'Sep 2022 — Jan 2023', loc: 'Singapore',
      deck: 'Validated and enhanced MRT station crowdedness forecasting; tightened streaming data pipelines.', body: 'Model shipped to the MyTransportSG app.',
      tech: ['Python', 'ML Forecasting', 'Streaming Pipelines'] },
    { slug: 'illumina', company: 'Illumina', short: 'Illumina', role: 'Senior Data Scientist', start: [2023, 1], end: [2025, 6], dates: 'Jan 2023 — Jun 2025', loc: 'Singapore', gen: true,
      deck: "Solo-architected and shipped two production AI systems as the company's sole data scientist.", body: 'An agentic document-retrieval platform for global field service engineers — sixteen components: semantic chunking, HyDE, hybrid search, Cohere reranking, prompt compression, an iterative agentic retrieval loop, blue-green vector collection swap. Plus a separate Generative BI assistant covering 800+ business metrics with human-in-the-loop design.',
      tech: ['Python', 'LlamaIndex', 'Qdrant', 'AWS Bedrock', 'RabbitMQ', 'Docker+CUDA', 'GitHub Actions', 'SonarQube', 'Grafana', 'Prometheus', 'Loki', 'Chainlit', 'DSPy', 'Giskard'], hl: { figure: '$9M', caption: 'anticipated savings upon full deployment' }, ask: ['the retrieval platform', 'How does the Illumina retrieval platform work?'] },
    { slug: 'uob', company: 'United Overseas Bank', short: 'UOB', role: 'Vice President, Generative AI', start: [2025, 6], end: [2026, 7], dates: 'Jun 2025 — Jul 2026', loc: 'Singapore', gen: true,
      deck: 'Sole engineer on a real-time GenAI contact-centre platform: live call transcripts, in-call assistance and policy search for agents, and post-call summaries with red-flag and promise checks.', body: "Picked up Java to take over its Spring Boot microservices, and cut false positives in its post-call checks by 80% with an LLM-driven prompt-optimisation loop on the bank's self-hosted models. Also built the MCP service behind UOB's customer onboarding workflow: a deterministic LangGraph workflow that handles incomplete and inconsistent documents, with LLM reasoning where it helps.",
      tech: ['Java (Spring Boot)', 'React', 'Redis', 'Oracle DB', 'ELK Stack', 'Splunk', 'Docker', 'Red Hat OpenShift', 'vLLM', 'Helm Charts', 'Apache Jenkins', 'LangChain', 'LangGraph', 'MCP'], hl: { figure: '80%', caption: 'fewer false positives in post-call checks' }, ask: ['the contact-centre platform', 'How did you cut false positives at UOB?'] },
    { slug: 'mastercard', company: 'Mastercard', short: 'Mastercard', role: 'Lead AI Engineer', start: [2026, 7], end: null, dates: 'Jul 2026 — Present', loc: 'Singapore', gen: true, now: true,
      deck: "Working on Agent Suite at the R&D Foundry — Mastercard's platform for enterprises to build, test, and deploy AI agents.", link: 'Agent Suite', body: 'Architected and built the SDK and CLI, including a bespoke package-manager setup: a shared foundation that replaces one-off agent builds with a common, governed standard. Agents are built declaratively: teams declare them in YAML, then chat with them in the terminal or serve them as an API. Assistant skills ship inside the packages, and contributor tooling keeps both codebases consistent.',
      tech: ['Python', 'LangChain', 'Typer', 'FastAPI', 'Docker', 'Helm Charts', 'GitHub Actions', 'Apache Jenkins'], hl: { figure: 'Tech lead', caption: 'and anchor contributor for the core SDK behind Agent Suite' }, ask: ['Agent Suite', 'What do you do on Agent Suite?'] },
  ]

  const $ = (s) => document.querySelector(s)
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  const months = ([y, m]) => y * 12 + (m - 1)
  const TODAY = [2026, 11]
  const tenure = (r) => { const n = months(r.end || TODAY) - months(r.start); const y = Math.floor(n / 12), m = n % 12; return y ? `${y} yr${y > 1 ? 's' : ''}${m ? ` ${m} mo` : ''}` : `${m} months` }
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
  const ym = (d) => `${MON[d[1] - 1]} ${d[0]}`
  // each company's band, in the site's palette
  // each company's colour (and logo, where I have one). Mastercard's is its own; the rest are placeholders until I have the logos.
  // each company's colour, taken from its logo. Logos: your files, or cut from the LinkedIn screenshot (sprite: y offset).
  const BRAND = {
    'toyota-tsusho': { color: 'oklch(0.48 0.16 258)', img: 'logos/toyota-tsusho.png' },
    jobtech: { color: 'oklch(0.6 0.14 145)', img: 'logos/jobtech.png' },
    ema: { color: 'oklch(0.55 0.17 25)', sprite: 1310 },
    'ck-delta': { color: 'oklch(0.2 0.01 60)', sprite: 969 },
    illumina: { color: 'oklch(0.72 0.16 65)', sprite: 585 },
    uob: { color: 'oklch(0.5 0.15 262)', sprite: 303 },
    mastercard: { color: 'oklch(0.64 0.2 42)', img: 'logos/mastercard-mark.svg' },
  }
  const CHIP = 30, SCALE = CHIP / 96
  const logo = (b) => b.sprite != null
    ? `<span class="logo" style="background-image:url(logos/sprite.png);background-size:${780 * SCALE}px auto;background-position:-${91 * SCALE}px -${b.sprite * SCALE}px"></span>`
    : `<span class="logo"><img src="${b.img}" alt=""></span>`

  const fan = $('#fan'), N = ROLES.length
  ROLES.forEach((r, i) => {
    const b = document.createElement('button')
    b.className = 'pass'; b.id = `pass-${r.slug}`; b.dataset.slug = r.slug; b.style.setProperty('--brand', BRAND[r.slug].color)
    b.setAttribute('role', 'tab'); b.setAttribute('aria-label', `${r.company}, ${r.role}, ${r.dates}`)
    const k = i - (N - 1) / 2
    b.style.setProperty('--rot', `${k * 4.2}deg`)
    b.style.left = `calc(${(i / (N - 1)) * 100}% - ${(i / (N - 1)) * 220}px)`
    b.style.top = `${40 + Math.abs(k) * k * 1.2 + Math.abs(k) * 6}px`
    b.style.zIndex = i + 1
    const hl = r.hl
    b.innerHTML = `<div class="card">
      <div class="face front">
        <span class="slot"></span>
        <div class="band" style="background:var(--brand)"><div class="brandrow">${logo(BRAND[r.slug])}<div><div class="co">${r.short}</div><div class="kind">STAFF</div></div></div></div>
        ${r.now ? '<span class="tag">CURRENT</span>' : ''}
        <div class="who"><div class="mono">T·L</div><div class="nm">Titus Lim<small>LIM HSIEN YONG</small></div></div>
        <div class="role">${r.role}</div>
        <div class="valid">Valid from <b>${ym(r.start)}</b><br>${r.end ? `to <b>${ym(r.end)}</b>` : '<b>to present</b>'}</div>
        <div class="code"></div>
        <div class="hl">${hl ? `<div class="f ${/^\D*\d/.test(hl.figure) ? '' : 'words'}">${hl.figure}</div><div class="c">${hl.caption}</div>` : `<div class="f">${tenure(r)}</div><div class="c">${r.now ? 'so far' : 'in the role'}</div>`}</div>
      </div>
      <div class="face back"><div class="inner">
        <span class="lbl">${r.short} · ${hl ? 'Highlight' : 'What I did'}</span>
        ${hl ? `<div class="fig ${/^\D*\d/.test(hl.figure) ? '' : 'words'}">${hl.figure}</div><div class="cap">${hl.caption}</div>` : `<div class="deck">${esc(r.deck)}</div>`}
        <div class="ten"><b>${tenure(r)}</b> ${r.now ? 'so far' : 'on this pass'}</div>
        <div class="down">The full story is below ↓</div>
      </div></div>
    </div>`
    b.addEventListener('click', () => open(r.slug, true))
    fan.appendChild(b)
  })

  let current = ROLES[N - 1].slug
  function open(slug, focus, flip) {
    current = slug
    document.querySelectorAll('.pass').forEach((p) => {
      const on = p.dataset.slug === slug
      p.setAttribute('aria-selected', on); p.tabIndex = on ? 0 : -1
    })
    const i = ROLES.findIndex((r) => r.slug === slug), r = ROLES[i]
    $('#badge').innerHTML = `Pass <b>${i + 1}</b> of ${N} · ${r.short}`
    $('#signdates').textContent = r.dates
    $('#prev').disabled = i === 0; $('#next').disabled = i === N - 1
    if (all) { document.getElementById(`role-${slug}`)?.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); if (focus) document.getElementById(`pass-${slug}`).focus({ preventScroll: true }); return }
    $('#panel').innerHTML = roleHtml(r)
    $('#panel .ask').addEventListener('click', (e) => toast(`Opens Ask Titus with: “${e.currentTarget.dataset.q}”`))
    const el0 = document.getElementById(`pass-${slug}`)
    if (focus) el0.focus({ preventScroll: true })
    if (matchMedia('(max-width: 820px)').matches) el0.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', inline: 'center', block: 'nearest' })
  }
  function roleHtml(r, turn = true) {
    const deck = r.link ? esc(r.deck).replace(r.link, `<a href="#">${r.link}</a>`) : esc(r.deck)
    return `<article class="item ${turn ? 'turn' : ''}">
      <div class="side"><div class="label">${r.dates}</div><div class="co2">${r.company}</div><p class="ro2">${r.role}</p><div class="where">${r.loc}</div></div>
      <div class="main">
        ${r.hl ? `<div class="glabel">Highlight</div><div class="hero"><div class="fig ${/^\D*\d/.test(r.hl.figure) ? '' : 'words'}">${r.hl.figure}</div><div class="cap">${r.hl.caption}</div></div>` : ''}
        <div class="glabel">What I did</div>
        <div class="story"><p class="lead">${deck}</p>${r.body ? `<p class="more">${esc(r.body)}</p>` : ''}</div>
        <div class="glabel">Stack</div>
        <div class="pills">${r.tech.map((t) => `<span class="pill">${t}</span>`).join('')}</div>
        <button class="ask" data-q="${r.ask ? r.ask[1] : `Tell me about your time at ${r.short}.`}">Ask about ${r.ask ? r.ask[0] : r.short} <b>→</b></button>
      </div></article>`
  }
  let all = false
  $('#all').onclick = () => {
    all = !all
    $('#all').setAttribute('aria-pressed', all); $('#all').textContent = all ? 'One at a time' : 'Show all seven ↓'
    document.body.classList.toggle('showall', all)
    if (all) {
      $('#panel').innerHTML = [...ROLES].reverse().map((r) => { const i = ROLES.indexOf(r); return `<div class="allsign" id="role-${r.slug}"><i style="background:${BRAND[r.slug].color}"></i>Pass ${i + 1} of ${N} · ${r.short} · ${r.dates}</div>${roleHtml(r, false)}` }).join('')
      $('#panel').querySelectorAll('.ask').forEach((b) => b.addEventListener('click', (e) => toast(`Opens Ask Titus with: “${e.currentTarget.dataset.q}”`)))
      $('.details').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' })
    } else open(current)
  }
  const step = (d) => { const i = ROLES.findIndex((r) => r.slug === current) + d; if (ROLES[i]) open(ROLES[i].slug, true, true) }
  $('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1)
  fan.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1) } if (e.key === 'ArrowRight') { e.preventDefault(); step(1) } })

  document.querySelectorAll('.rt').forEach((b) => b.addEventListener('click', () => {
    open(b.dataset.go, false, true)
    $('.desk').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' })
  }))
  let tt
  function toast(m) { $('#toast').textContent = m; $('#toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('on'), 2600) }
  open(current)
</script>
</body>
</html>
