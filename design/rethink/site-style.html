<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site style — Education and Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: oklch(0.972 0.012 78); --paper-deep: oklch(0.945 0.014 78); --paper-band: oklch(0.928 0.018 78);
    --ink: oklch(0.16 0.012 60); --ink-soft: oklch(0.42 0.012 60); --ink-faint: oklch(0.6 0.012 60);
    --rule: oklch(0.8 0.012 78); --amber: oklch(0.62 0.155 55); --amber-hi: oklch(0.8 0.12 65); --indigo: oklch(0.34 0.10 254);
    /* latte: anything nested under something bigger */
    --latte: oklch(0.885 0.035 68); --latte-tile: oklch(0.935 0.022 72); --latte-tile-hi: oklch(0.96 0.015 75);
    --latte-accent: oklch(0.45 0.08 50); --latte-soft: oklch(0.4 0.03 55);
    --serif: 'Newsreader', Georgia, serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px); }
  .num { color: var(--amber); }

  .switch { position: sticky; top: 0; z-index: 20; background: color-mix(in oklch, var(--paper) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
  .switch .wrap { display: flex; gap: 8px; align-items: center; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
  .switch span { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); margin-right: 8px; }
  .switch button { font: 13px var(--mono); border: 1px solid var(--rule); background: var(--paper); color: var(--ink-soft); padding: 8px 14px; border-radius: 999px; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .page { display: none; padding: 40px 0 120px; } .page.on { display: block; }

  .kicker { font: 500 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
  .kicker b { color: var(--amber); font-weight: 600; margin-right: 10px; }
  h1 { font-size: clamp(34px, 5vw, 68px); font-weight: 500; letter-spacing: -.025em; line-height: 1.04; margin: 22px 0 36px; max-width: 22ch; }
  h1 em { color: var(--amber); }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: none; }

  /* results row: small dark tiles that jump to their item */
  .results { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .rt { position: relative; overflow: hidden; text-align: left; border: 0; cursor: pointer; background: var(--ink); color: var(--paper); border-radius: 20px; padding: 20px 20px 18px; transition: transform .25s; }
  .rt:hover { transform: translateY(-3px); }
  .rt .fig { display: block; font: 500 clamp(28px, 3.2vw, 42px)/1 var(--serif); letter-spacing: -.03em; color: var(--amber-hi); white-space: nowrap; }
  .rt .lab { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; font: 11.5px/1.45 var(--mono); color: oklch(0.85 0.02 78); }
  .rt .lab i { font-style: normal; color: var(--amber-hi); }

  /* one item: pinned label column + content */
  .item { display: grid; grid-template-columns: 300px 1fr; gap: 48px; padding: 56px 0; border-top: 1px solid var(--rule); scroll-margin-top: 70px; }
  .side { position: sticky; top: 90px; align-self: start; }
  .side .label { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--amber); }
  .side h2 { font-size: 34px; font-weight: 500; letter-spacing: -.02em; line-height: 1.08; margin: 10px 0; }
  .side p { font-size: 19px; color: var(--ink); margin: 0; line-height: 1.3; }
  .side .where { font: 12px var(--mono); color: var(--ink-faint); margin-top: 8px; }
  .glabel { font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin: 26px 0 10px; }
  .main > .glabel:first-child { margin-top: 0; }

  /* the dark headline tile */
  .hero { position: relative; overflow: hidden; background: var(--ink); color: var(--paper); border-radius: 28px; padding: 40px 40px 34px; min-height: 220px; display: flex; flex-direction: column; justify-content: flex-end; }
  .hero::before { content: ''; position: absolute; inset: -40%; background: radial-gradient(closest-side, oklch(0.62 0.155 55 / .35), transparent 70%); animation: drift 14s ease-in-out infinite alternate; }
  .hero.indigo::before { background: radial-gradient(closest-side, oklch(0.5 0.14 254 / .55), transparent 70%); }
  .hero.indigo .fig { color: oklch(0.82 0.08 254); }
  @keyframes drift { from { transform: translate(-18%, -10%); } to { transform: translate(22%, 14%); } }
  .hero > * { position: relative; }
  .hero .fig { font-size: clamp(56px, 8vw, 104px); font-weight: 500; letter-spacing: -.04em; line-height: .9; color: var(--amber-hi); }
  .hero .fig.words { font-size: clamp(44px, 6vw, 80px); }
  .hero .cap { font-size: 22px; margin-top: 12px; font-style: italic; color: oklch(0.88 0.02 78); }
  .hero .chip2 { position: absolute; top: 26px; right: 28px; font: 12px var(--mono); color: var(--paper); border: 1px solid oklch(1 0 0 / .3); border-radius: 999px; padding: 6px 12px; }

  /* cream tiles: the details */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile { background: var(--paper-deep); border-radius: 20px; padding: 20px 22px; transition: transform .25s, background .25s; }
  .tile:hover { transform: translateY(-3px); background: var(--paper-band); }
  .tile .r { font-size: 19px; font-weight: 500; line-height: 1.25; } .tile .c { font: 11.5px/1.45 var(--mono); color: var(--ink-soft); margin-top: 6px; }
  .story { background: var(--paper-deep); border-radius: 20px; padding: 24px 26px; }
  .story .lead { font-size: 21px; line-height: 1.35; margin: 0; } .story .lead a { color: inherit; text-decoration-color: var(--amber); text-underline-offset: 3px; }
  .story .more { font-size: 17px; line-height: 1.5; color: var(--ink-soft); margin: 12px 0 0; }

  /* tech pills */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { font: 12.5px var(--mono); background: var(--paper-deep); border-radius: 999px; padding: 7px 13px; color: var(--ink-soft); cursor: default; transition: background .2s, color .2s; }
  .pill.on { background: var(--ink); color: var(--paper); }

  /* latte boxes: nested or earlier */
  .glabel.latte { color: var(--latte-accent); margin-top: 40px; }
  .boxes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .box { background: var(--latte); border-radius: 28px; padding: 28px 26px 26px; }
  .box .sub { font: 500 11px var(--mono); letter-spacing: .1em; color: var(--latte-accent); }
  .box h3 { margin: 6px 0 0; font-size: 24px; font-weight: 500; letter-spacing: -.015em; }
  .box .pdeg { font-size: 16px; font-style: italic; color: var(--latte-soft); margin-top: 4px; line-height: 1.35; }
  .box .big { font-size: clamp(26px, 2.6vw, 34px); font-weight: 500; letter-spacing: -.025em; line-height: 1.05; color: var(--latte-accent); margin-top: 20px; }
  .box .glabel { margin: 20px 0 8px; color: var(--latte-accent); }
  .box .tiles { grid-template-columns: 1fr; gap: 8px; }
  .box .tile { background: var(--latte-tile); border-radius: 16px; padding: 14px 16px; }
  .box .tile:hover { background: var(--latte-tile-hi); } .box .tile .r { font-size: 17px; } .box .tile .c { color: var(--latte-soft); }
  .box .num { color: var(--latte-accent); }
  .box p.deck { font-size: 17px; line-height: 1.45; margin: 14px 0 0; }
  .box .pills { margin-top: 16px; } .box .pill { background: var(--latte-tile); color: var(--latte-soft); font-size: 11.5px; padding: 5px 11px; }
  .box .pill.on { background: var(--ink); color: var(--paper); }

  /* Ask Titus pill */
  .ask { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; font: 13px var(--mono); color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 9px 16px; cursor: pointer; transition: background .2s, color .2s; }
  .ask:hover { background: var(--ink); color: var(--paper); }
  .ask b { color: var(--amber); font-weight: 600; } .ask:hover b { color: var(--amber-hi); }
  .box .ask { border-color: var(--latte-accent); color: var(--latte-accent); padding: 7px 13px; font-size: 12px; }
  .box .ask:hover { background: var(--latte-accent); color: var(--paper); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--paper); font: 13px var(--mono); padding: 12px 18px; border-radius: 999px; transition: .3s; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  .flash { animation: flash 2.4s ease; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--amber); } 100% { box-shadow: 0 0 0 4px transparent; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; } .reveal { opacity: 1; transform: none; transition: none; } .hero::before { animation: none; }
    .tile:hover, .rt:hover { transform: none; }
  }
  @media (max-width: 820px) {
    .results { grid-template-columns: 1fr 1fr; } .tiles, .boxes { grid-template-columns: 1fr; }
    .item { grid-template-columns: 1fr; gap: 20px; } .side { position: static; }
    .hero { padding: 28px 24px 24px; min-height: 180px; } .hero .chip2 { top: 18px; right: 18px; }
  }
</style>
</head>
<body>
<div class="switch"><div class="wrap">
  <span>One style, two pages</span>
  <button data-p="edu" aria-pressed="true">Education</button>
  <button data-p="exp">Experience</button>
</div></div>

<div class="wrap">
  <section class="page on" id="edu"></section>
  <section class="page" id="exp"></section>
</div>
<div class="toast" id="toast"></div>

<script>
const amb = (t) => t.replace(/(\d+(?:\.\d+)?(?:(?:st|nd|rd|th)\b)?)/g, '<span class="num">$1</span>')
const tile = ([r, c]) => `<div class="tile reveal"><div class="r">${amb(r)}</div>${c ? `<div class="c">${c}</div>` : ''}</div>`
const groups = (gs) => gs.map(([name, hs]) => `<div class="glabel">${name}</div><div class="tiles">${hs.map(tile).join('')}</div>`).join('')
const ask = (label, q) => `<button class="ask" data-q="${q}">Ask about ${label} <b>→</b></button>`
const results = (rs) => `<div class="results">${rs.map(([f, l, id]) => `<button class="rt reveal" data-go="${id}"><span class="fig" data-count="${f}">${f}</span><span class="lab">${l}<i>↓</i></span></button>`).join('')}</div>`
const hero = (h, extra = '') => `<div class="hero reveal ${extra}"><div class="fig ${h.words ? 'words' : ''}" data-count="${h.fig}">${h.fig}</div><div class="cap">${h.cap}</div>${h.chip ? `<div class="chip2">${h.chip}</div>` : ''}</div>`

/* ---------------- Education ---------------- */
const ED = [
  { id: 'smu', label: "Master's · 2021 — 2022", inst: 'Singapore Management University', deg: 'Master of IT in Business, AI track',
    hero: { fig: '3.98', cap: 'GPA out of 4.0', chip: "Dean's List" },
    groups: [['Scholarships', [['MITB Scholarship'], ['SMU AI Talent Development Grant']]],
             ['Achievements', [['1st place', 'Food Image Classification competition'], ['3rd place', 'Recommender Systems competition']]]],
    ask: ['my Master’s', 'What did you study in your Master’s at SMU?'] },
  { id: 'nus', label: "Bachelor's · 2011 — 2015", inst: 'National University of Singapore', deg: 'BEng Chemical Engineering',
    hero: { fig: '2nd Upper', cap: 'Class Honours', words: true },
    groups: [['Scholarships', [['NUS Undergraduate Scholarship']]],
             ['Achievements', [['Selected to present', 'Shell Global Energy, Water & Food Security Roundtable'], ['88th percentile globally', 'Bloomberg Aptitude Test']]]],
    ask: ['NUS', 'What did you do at NUS?'],
    parts: [
      { yr: '2013', inst: 'University of Connecticut', deg: 'Exchange, Chemical & Biomolecular Engineering', big: 'First Class with Distinction',
        groups: [['Scholarships', [['NUS Scholars Enrichment Grant']]], ['Achievements', [['Top of the class in two modules', 'Process Kinetics and Heat & Mass Transfer'], ['Top 10 in two PhD modules', 'taken in year 2'], ['"Most Inspiring Student"', 'AIChE UConn chapter']]]],
        ask: ['UConn', 'What was your exchange at UConn like?'] },
      { yr: '2014', inst: 'University of Oxford', deg: 'IARU Global Summer School, Global Challenges of the 21st Century', big: 'First Class with Distinction',
        groups: [['Scholarships', [['IARU-Santander Scholarship']]], ['Achievements', [['1 of 14 selected worldwide']]]],
        ask: ['Oxford', 'What did you do at the Oxford summer school?'] },
      { yr: '2014', inst: 'NUS Suzhou Research Institute', deg: 'Winter school, immersion in Chinese business culture', big: '1 of 3 chemical engineers selected',
        groups: [['Scholarships', [['Market Immersion Award', 'IE Singapore Young Talent Programme']]]],
        ask: ['Suzhou', 'What was the Suzhou winter school about?'] },
    ] },
  { id: 'ajc', label: 'A Levels · 2007 — 2008', inst: 'Anderson Junior College', deg: "GCE 'A' Levels, Physical Sciences",
    hero: { fig: 'Top Student', cap: 'Award', words: true },
    groups: [['Achievements', [['Certificate of Distinction', 'Alpha Students Programme'], ['Chess Club President', 'College Colours'], ['Platinum Award', 'Community Involvement Programme'], ['Sports Leaders Award']]]],
    ask: ['Anderson JC', 'What did you do at Anderson Junior College?'] },
]
document.getElementById('edu').innerHTML =
  '<div class="kicker"><b>02</b>Education</div><h1>Where I have <em>studied</em>, in reverse.</h1>' +
  results([['3.98', 'GPA at SMU', 'smu'], ['Top Student', 'Award at AJC', 'ajc'], ['1st', 'Food Image Classification competition, SMU', 'smu'], ['2×', 'First Class with Distinction (UConn, Oxford)', 'nus-parts']]) +
  ED.map((e) => `<article class="item" id="${e.id}">
    <div class="side"><div class="label">${e.label}</div><h2>${e.inst}</h2><p>${e.deg}</p><div class="where">Singapore</div></div>
    <div class="main">
      <div class="glabel">Results</div>${hero(e.hero)}
      ${groups(e.groups)}
      ${ask(...e.ask)}
      ${e.parts ? `<div class="glabel latte" id="nus-parts">During NUS</div><div class="boxes">${e.parts.map((p) => `<div class="box reveal">
        <div class="sub">${p.yr}</div><h3>${p.inst}</h3><div class="pdeg">${p.deg}</div><div class="big">${p.big}</div>
        ${groups(p.groups)}${ask(...p.ask)}</div>`).join('')}</div>` : ''}
    </div></article>`).join('')

/* ---------------- Experience ---------------- */
const FEATURED = [
  { id: 'mastercard', label: '2026 — Present', co: 'Mastercard', role: 'Lead AI Engineer',
    hero: { fig: 'Tech lead', cap: 'and anchor contributor for the core SDK behind Agent Suite', words: true },
    lead: 'Working on <a href="#">Agent Suite</a> at the R&amp;D Foundry — Mastercard’s platform for enterprises to build, test, and deploy AI agents.',
    more: 'Architected and built the SDK and CLI, including a bespoke package-manager setup: a shared foundation that replaces one-off agent builds with a common, governed standard. Agents are built declaratively: teams declare them in YAML, then chat with them in the terminal or serve them as an API.',
    tech: ['Python', 'LangChain', 'Typer', 'FastAPI', 'Docker', 'Helm Charts', 'GitHub Actions', 'Apache Jenkins'],
    ask: ['Agent Suite', 'What do you do on Agent Suite?'] },
  { id: 'uob', label: 'Jun 2025 — Jul 2026', co: 'United Overseas Bank', role: 'Vice President, Generative AI',
    hero: { fig: '80%', cap: 'fewer false positives in post-call checks' },
    lead: 'Sole engineer on a real-time GenAI contact-centre platform: live call transcripts, in-call assistance and policy search for agents, and post-call summaries with red-flag and promise checks.',
    more: 'Picked up Java to take over its Spring Boot microservices, and cut false positives by 80% with an LLM-driven prompt-optimisation loop on the bank’s self-hosted models. Also built the MCP service behind UOB’s customer onboarding workflow.',
    tech: ['Java (Spring Boot)', 'React', 'Redis', 'Oracle DB', 'ELK Stack', 'Splunk', 'Docker', 'Red Hat OpenShift', 'vLLM', 'Helm Charts', 'Apache Jenkins', 'LangChain', 'LangGraph', 'MCP'],
    ask: ['the contact-centre platform', 'How did you cut false positives at UOB?'] },
  { id: 'illumina', label: 'Jan 2023 — Jun 2025', co: 'Illumina', role: 'Senior Data Scientist',
    hero: { fig: '$9M', cap: 'anticipated savings upon full deployment' },
    lead: 'Solo-architected and shipped two production AI systems as the company’s sole data scientist.',
    more: 'An agentic document-retrieval platform for global field service engineers, plus a separate Generative BI assistant covering 800+ business metrics with human-in-the-loop design.',
    tech: ['Python', 'LlamaIndex', 'Qdrant', 'AWS Bedrock', 'RabbitMQ', 'Docker+CUDA', 'GitHub Actions', 'SonarQube', 'Grafana', 'Prometheus', 'Loki', 'Chainlit', 'DSPy', 'Giskard'],
    ask: ['the retrieval platform', 'How does the Illumina retrieval platform work?'] },
]
const EARLIER = [
  { yr: '2022 — 2023', co: 'CK Delta', role: 'Data Scientist', deck: 'Validated and enhanced MRT station crowdedness forecasting; tightened streaming data pipelines. Model shipped to the MyTransportSG app.', tech: ['Python', 'ML Forecasting', 'Streaming Pipelines'] },
  { yr: '2018 — 2022', co: 'Energy Market Authority', role: 'Principal Engineer, Research & Statistics', deck: 'Developed and presented national electricity and gas demand forecasts to Ministers and Permanent Secretaries; drove the Authority’s AI and data strategy roadmap.', tech: ['Python', 'XGBoost', 'Neural Networks', 'DataRobot', 'ARIMA'] },
  { yr: '2017', co: 'JobTech', role: 'Data Scientist', deck: 'Built a national-scale skill extraction algorithm using NLP to construct skills graphs from online job portals.', tech: ['Python', 'NLP', 'Regex Entity Extraction'] },
  { yr: '2015 — 2017', co: 'Toyota Tsusho Asia Pacific', role: 'Demand & Supply Analyst', big: '~25% better long-term forecast accuracy', deck: 'Overhauled sales planning into a centralised automated forecasting tool.', tech: ['VBA', 'Excel', 'Exponential Smoothing', 'Holt-Winters'] },
]
const pills = (t) => `<div class="pills">${t.map((x) => `<span class="pill" data-tech="${x.toLowerCase()}">${x}</span>`).join('')}</div>`
document.getElementById('exp').innerHTML =
  '<div class="kicker"><b>01</b>Experience</div><h1>Where I have <em>worked</em>, in reverse.</h1>' +
  results([['8+', 'years building production AI', 'mastercard'], ['$9M', 'anticipated savings, Illumina', 'illumina'], ['80%', 'fewer false positives, UOB', 'uob'], ['~25%', 'better forecast accuracy, Toyota Tsusho', 'earlier']]) +
  FEATURED.map((r) => `<article class="item" id="${r.id}">
    <div class="side"><div class="label">${r.label}</div><h2>${r.co}</h2><p>${r.role}</p><div class="where">Singapore</div></div>
    <div class="main">
      <div class="glabel">Highlight</div>${hero(r.hero, r.indigo ? 'indigo' : '')}
      <div class="glabel">What I did</div><div class="story reveal"><p class="lead">${r.lead}</p><p class="more">${r.more}</p></div>
      <div class="glabel">Stack</div>${pills(r.tech)}
      ${ask(...r.ask)}
    </div></article>`).join('') +
  `<article class="item" id="earlier"><div class="side"><div class="label">2015 — 2023</div><h2>Earlier roles</h2><p>Forecasting, NLP and analytics, before GenAI.</p></div>
    <div class="main"><div class="boxes">${EARLIER.map((r) => `<div class="box reveal"><div class="sub">${r.yr}</div><h3>${r.co}</h3><div class="pdeg">${r.role}</div>
      ${r.big ? `<div class="big">${amb(r.big)}</div>` : ''}<p class="deck">${r.deck}</p>${pills(r.tech)}</div>`).join('')}</div></div></article>`

/* ---------------- behaviour ---------------- */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
// count up any figure that starts with a number: 3.98, $9M, 80%, ~25%, 2×, 8+
const countUp = (el) => {
  const m = el.dataset.count.match(/^(\D*?)(\d+(?:\.\d+)?)(.*)$/); if (!m || reduce) return
  // ordinals ("1st") and small counts ("2×") read oddly mid-count ("0st"), so they stay still
  if (/^(st|nd|rd|th)/.test(m[3]) || (!m[2].includes('.') && parseFloat(m[2]) < 10)) return
  const to = parseFloat(m[2]), dp = (m[2].split('.')[1] || '').length, t0 = performance.now()
  const tick = (t) => { const k = Math.min(1, (t - t0) / 1200), v = to * (1 - Math.pow(1 - k, 3)); el.textContent = m[1] + v.toFixed(dp) + m[3]; if (k < 1) requestAnimationFrame(tick) }
  requestAnimationFrame(tick)
}
const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (!e.isIntersecting) return
  e.target.classList.add('in'); io.unobserve(e.target)
  const f = e.target.querySelector('[data-count]'); if (f) countUp(f)
}), { threshold: 0.3 })
const watch = () => document.querySelectorAll('.page.on .reveal:not(.in)').forEach((el) => io.observe(el))
watch()

document.querySelectorAll('.switch button').forEach((b) => b.addEventListener('click', () => {
  document.querySelectorAll('.switch button').forEach((x) => x.setAttribute('aria-pressed', x === b))
  document.querySelectorAll('.page').forEach((p) => p.classList.toggle('on', p.id === b.dataset.p))
  scrollTo(0, 0); watch()
}))
document.addEventListener('click', (ev) => {
  const go = ev.target.closest('[data-go]')
  if (go) { const t = document.getElementById(go.dataset.go); t.scrollIntoView({ block: 'start' }); const h = t.querySelector('.hero, .boxes') || t; h.classList.remove('flash'); void h.offsetWidth; h.classList.add('flash') }
  const a = ev.target.closest('.ask')
  if (a) { const t = document.getElementById('toast'); t.textContent = `Opens Ask Titus with: “${a.dataset.q}”`; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600) }
})
// hover a tech pill: light up the same tool in every role
document.addEventListener('mouseover', (ev) => { const p = ev.target.closest('.pill'); if (!p) return
  document.querySelectorAll(`.pill[data-tech="${CSS.escape(p.dataset.tech)}"]`).forEach((x) => x.classList.add('on')) })
document.addEventListener('mouseout', (ev) => { if (ev.target.closest('.pill')) document.querySelectorAll('.pill.on').forEach((x) => x.classList.remove('on')) })
</script>
</body>
</html>
