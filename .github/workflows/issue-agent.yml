# Issue agent: Titus labels his own issue `agent:bug` or `agent:feature`, and
# Claude fixes the bug (PR) or grills him and writes a reviewed plan (PR).
# Behaviour lives in .github/issue-agent/{bug,feature}.md; runner permissions
# in .github/issue-agent/ci-settings.json. See CLAUDE.md → "Issue Agent".
name: Issue agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: issue-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bug:
    if: >-
      github.event.sender.login == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      !contains(github.event.issue.labels.*.name, 'agent:off') &&
      ((github.event_name == 'issues' && github.event.label.name == 'agent:bug') ||
       (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'agent:bug')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use CI Claude settings
        run: |
          cp .github/issue-agent/ci-settings.json .claude/settings.json
          git update-index --skip-worktree .claude/settings.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          include_comments_by_actor: tituslhy,github-actions[bot]
          branch_prefix: agent/
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ github.event.issue.number }}
            EVENT: ${{ github.event_name }}.${{ github.event.action }}
            TRIGGER_LABEL: ${{ github.event.label.name }}

            You are the issue agent's bug track.
            Read and follow `.github/issue-agent/bug.md` exactly.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,Bash(npm ci),Bash(npm run lint),Bash(npm test:*),Bash(npx jest:*),Bash(npm run build),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git ls-remote:*),Bash(git stash:*),Bash(git fetch:*),Bash(bash .github/issue-agent/thread.sh:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*)"

  feature:
    if: >-
      github.event.sender.login == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open' &&
      !github.event.issue.pull_request &&
      !contains(github.event.issue.labels.*.name, 'agent:off') &&
      ((github.event_name == 'issues' && github.event.label.name == 'agent:feature') ||
       (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'agent:feature')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use CI Claude settings
        run: |
          cp .github/issue-agent/ci-settings.json .claude/settings.json
          git update-index --skip-worktree .claude/settings.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          include_comments_by_actor: tituslhy,github-actions[bot]
          branch_prefix: agent/
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ github.event.issue.number }}
            EVENT: ${{ github.event_name }}.${{ github.event.action }}
            TRIGGER_LABEL: ${{ github.event.label.name }}

            You are the issue agent's feature track.
            Read and follow `.github/issue-agent/feature.md` exactly.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,Write,Glob,Grep,Task,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git ls-remote:*),Bash(git fetch:*),Bash(bash .github/issue-agent/thread.sh:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*)"
